{% extends 'base.html' %}

{% block title %}Додати товар{% endblock %}

{% block content %}
<h1>Новий товар</h1>
<form method="post">
  {% csrf_token %}
  <p><input name="name" placeholder="Назва" required></p>
  <p><input name="price" type="number" step="0.01" placeholder="Ціна" required></p>
  <button type="submit">Зберегти</button>
</form>
{% endblock %}
