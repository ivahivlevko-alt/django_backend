{% extends 'base.html' %}
{% load catalog_extras %}

{% block title %}Товари{% endblock %}

{% block content %}
<h1>Товари</h1>
<table>
  <tr><th>Назва</th><th>Ціна</th></tr>
  {% for p in products %}
    <tr><td>{{ p.name }}</td><td>{{ p.price|uah }}</td></tr>
  {% empty %}
    <tr><td colspan="2">Товарів немає</td></tr>
  {% endfor %}
</table>
{% endblock %}
